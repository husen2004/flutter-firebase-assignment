name: Build School IVR Temp APK
on:
  push:
    branches: [ build-school-ivr-temp ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project
        run: |
          rm -rf /tmp/schoolivr
          mkdir -p /tmp/schoolivr
          unzip -q school_ivr_android_v3_A51_android13_source.zip -d /tmp/schoolivr
      - name: Build debug APK
        working-directory: /tmp/schoolivr/school_ivr_android_v3_A51_android13
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-IVR-A51-Android13-debug
          path: /tmp/schoolivr/school_ivr_android_v3_A51_android13/app/build/outputs/apk/debug/app-debug.apk
