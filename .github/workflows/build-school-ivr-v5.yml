name: Build School IVR V5 APK
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack V5 project
        run: |
          rm -rf /tmp/schoolivr
          mkdir -p /tmp/schoolivr
          tar -xJf school_ivr_v5_A51_autoivr.tar.xz -C /tmp/schoolivr
      - name: Build V5 debug APK
        working-directory: /tmp/schoolivr/school_ivr_android_v5_A51_autoivr
        run: gradle assembleDebug --stacktrace
      - name: Show APK info
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging /tmp/schoolivr/school_ivr_android_v5_A51_autoivr/app/build/outputs/apk/debug/app-debug.apk | head -20
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions /tmp/schoolivr/school_ivr_android_v5_A51_autoivr/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afaq-School-IVR-V5-A51
          path: /tmp/schoolivr/school_ivr_android_v5_A51_autoivr/app/build/outputs/apk/debug/app-debug.apk
